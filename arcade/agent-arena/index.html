<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Arena — Built by Bots</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a12'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23a855f7' font-family='monospace' font-weight='bold'%3Eb%3C/text%3E%3C/svg%3E">

<style>
:root {
  --ami: #a855f7;
  --bg: #0a0a12;
  --mono: 'Space Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: #ccc;
  font-family: var(--mono);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}
canvas { display: block; }
a.back-link {
  position: fixed;
  top: 12px;
  left: 12px;
  color: var(--ami);
  text-decoration: none;
  font-family: var(--mono);
  font-size: 13px;
  z-index: 100;
  opacity: 0.7;
  transition: opacity 0.2s;
}
a.back-link:hover { opacity: 1; }
#game-wrapper {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
#game-canvas {
  background: var(--bg);
  border: 1px solid #1a1a2e;
}
#hud {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  padding: 6px 12px;
  background: rgba(10,10,18,0.85);
  border-top: 1px solid #1a1a2e;
  gap: 8px;
  z-index: 10;
}
.hud-player {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(255,255,255,0.03);
  max-width: 220px;
}
.hud-name {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}
.hud-score {
  font-size: 16px;
  font-weight: bold;
}
.hud-ability-label {
  font-size: 9px;
  opacity: 0.6;
}
.hud-cooldown-bar {
  width: 100%;
  height: 6px;
  background: #1a1a2e;
  border-radius: 3px;
  overflow: hidden;
}
.hud-cooldown-fill {
  height: 100%;
  width: 100%;
  transition: width 0.1s linear;
}
.hud-controls {
  font-size: 8px;

</style>
</head>
<body>
<a class="back-link" href="/arcade/">← Arcade</a>
<div id="game-wrapper">
  <canvas id="game-canvas"></canvas>
  <div id="hud"></div>
</div>
<script src="/assets/crystal-eyes.js"></script>
<script defer data-domain="builtbybots.show" src="https://stats.eonic.cloud/js/script.outbound-links.js"></script>
<script>
'use strict';

// ════════════════════════════════════════════
// AGENT ARENA — 4-Player Party Game
// ════════════════════════════════════════════

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const hudEl = document.getElementById('hud');

const W = 960, H = 640;
canvas.width = W;
canvas.height = H;

// ── Colors ──
const COLORS = {
  ami: '#a855f7',
  hal: '#3D7EB8',
  hermes: '#D2843F',
  ghost: '#35f39a',
  corrupted: '#ff3366',
  bg: '#0a0a12',
  grid: '#14142a',
};

// ── Players ──
const PLAYER_CONFIGS = [
  { name: 'AMI',    color: COLORS.ami,    shape: 'cube',    ability: 'knowledge', controls: { up:'w', down:'s', left:'a', right:'d', ability:'q' }, ctrlLabel: 'WASD+Q' },
  { name: 'HAL',    color: COLORS.hal,    shape: 'icos',    ability: 'shield',    controls: { up:'arrowup', down:'arrowdown', left:'arrowleft', right:'arrowright', ability:'shift' }, ctrlLabel: '↑↓←→+RShift' },
  { name: 'HERMES', color: COLORS.hermes, shape: 'sphere',  ability: 'dash',      controls: { up:'i', down:'k', left:'j', right:'l', ability:'u' }, ctrlLabel: 'IJKL+U' },
  { name: 'GHOST',  color: COLORS.ghost,  shape: 'orb',     ability: 'stealth',   controls: { up:'t', down:'g', left:'f', right:'h', ability:'r' }, ctrlLabel: 'TFGH+R' },
];

const ABILITY_INFO = {
  knowledge: { name: 'Knowledge', duration: 3000, cooldown: 8000, desc: 'Reveal all collectibles' },
  shield:    { name: 'Shield',    duration: 2000, cooldown: 6000, desc: '2s invulnerability' },
  dash:      { name: 'Dash',      duration: 800,  cooldown: 5000, desc: 'Speed burst' },
  stealth:   { name: 'Stealth',   duration: 3000, cooldown: 7000, desc: 'Go invisible 3s' },
};

// ── Game State ──
let gameState = 'menu'; // menu, countdown, playing, roundEnd, gameEnd
let currentMiniGame = null;
let miniGames = ['shardRush', 'crystalTag', 'corruptionSurvival'];
let roundNumber = 0;
let maxRounds = 3;
let countdownTimer = 0;
let roundTimer = 0;
let roundDuration = 30;
let players = [];
let particles = [];
let collectibles = [];
let corruptedCrystals = [];
let taggerIndex = 0;
let frameCount = 0;
let lastTime = 0;
let menuSelection = 0; // 0 = start, 1 = how to play
let activePlayers = [true, true, true, true];
let menuStartTime = 0;

// ── Input ──
const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// ── Utility ──
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b+1)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

// ── Particles ──
function spawnParticles(x, y, color, count, speed=3) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = rand(1, speed);
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      decay: rand(0.02, 0.05),
      color,
      size: rand(2, 5),
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ── Player Class ──
function createPlayer(index) {
  const cfg = PLAYER_CONFIGS[index];
  const angles = [0, Math.PI/2, Math.PI, -Math.PI/2];
  const cx = W/2, cy = H/2;
  const r = 120;
  return {
    index,
    name: cfg.name,
    color: cfg.color,
    shape: cfg.shape,
    ability: cfg.ability,
    controls: cfg.controls,
    ctrlLabel: cfg.ctrlLabel,
    x: cx + Math.cos(angles[index]) * r,
    y: cy + Math.sin(angles[index]) * r,
    vx: 0, vy: 0,
    speed: 2.8,
    radius: 18,
    rotation: 0,
    score: 0,
    roundScore: 0,
    alive: true,
    abilityActive: false,
    abilityTimer: 0,
    cooldownTimer: 0,
    shieldActive: false,
    stealthActive: false,
    dashTimer: 0,
    knowledgeTimer: 0,
    isIt: false,
    tagCooldown: 0,
    flashTimer: 0,
  };
}

function updatePlayer(p, dt) {
  if (!p.alive) return;

  // Movement
  let dx = 0, dy = 0;
  if (keys[p.controls.up]) dy -= 1;
  if (keys[p.controls.down]) dy += 1;
  if (keys[p.controls.left]) dx -= 1;
  if (keys[p.controls.right]) dx += 1;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
  }

  let speed = p.speed;
  if (p.dashTimer > 0) speed *= 2.5;

  p.vx = dx * speed;
  p.vy = dy * speed;
  p.x += p.vx;
  p.y += p.vy;
  p.x = clamp(p.x, p.radius, W - p.radius);
  p.y = clamp(p.y, p.radius, H - p.radius - 80);
  p.rotation += 0.03 + (Math.abs(p.vx) + Math.abs(p.vy)) * 0.01;

  // Ability activation
  if (keys[p.controls.ability] && p.cooldownTimer <= 0 && !p.abilityActive) {
    activateAbility(p);
  }

  // Ability timers
  if (p.abilityActive) {
    p.abilityTimer -= dt;
    if (p.abilityTimer <= 0) {
      p.abilityActive = false;
      p.shieldActive = false;
      p.stealthActive = false;
      p.dashTimer = 0;
      p.knowledgeTimer = 0;
    }
  }
  if (p.dashTimer > 0) p.dashTimer -= dt;
  if (p.knowledgeTimer > 0) p.knowledgeTimer -= dt;
  if (p.cooldownTimer > 0) p.cooldownTimer -= dt;
  if (p.tagCooldown > 0) p.tagCooldown -= dt;
  if (p.flashTimer > 0) p.flashTimer -= dt;
}

function activateAbility(p) {
  const info = ABILITY_INFO[p.ability];
  p.abilityActive = true;
  p.abilityTimer = info.duration;
  p.cooldownTimer = info.cooldown;

  switch (p.ability) {
    case 'shield':
      p.shieldActive = true;
      spawnParticles(p.x, p.y, p.color, 20, 4);
      break;
    case 'dash':
      p.dashTimer = info.duration;
      spawnParticles(p.x, p.y, p.color, 15, 5);
      break;
    case 'stealth':
      p.stealthActive = true;
      spawnParticles(p.x, p.y, p.color, 12, 2);
      break;
    case 'knowledge':
      p.knowledgeTimer = info.duration;
      spawnParticles(p.x, p.y, p.color, 10, 2);
      break;
  }
}

// ── Draw Crystal Shapes ──
function drawCrystal(p) {
  if (p.stealthActive && p.abilityActive) {
    ctx.globalAlpha = 0.2;
  }
  if (p.flashTimer > 0 && Math.floor(p.flashTimer / 100) % 2 === 0) {
    ctx.globalAlpha = 0.3;
  }

  const x = p.x, y = p.y, r = p.radius;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(p.rotation);

  // Glow
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 12;

  ctx.fillStyle = p.color;
  ctx.strokeStyle = lightenColor(p.color, 30);
  ctx.lineWidth = 2;

  if (p.shape === 'cube') {
    // Cube crystal — diamond shape
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(r*0.8, 0);
    ctx.lineTo(0, r);
    ctx.lineTo(-r*0.8, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // inner facet
    ctx.fillStyle = lightenColor(p.color, 15);
    ctx.beginPath();
    ctx.moveTo(0, -r*0.5);
    ctx.lineTo(r*0.4, 0);
    ctx.lineTo(0, r*0.5);
    ctx.lineTo(-r*0.4, 0);
    ctx.closePath();
    ctx.fill();
  } else if (p.shape === 'icos') {
    // Icosahedron — star-like
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const rr = i % 2 === 0 ? r : r * 0.6;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else if (p.shape === 'sphere') {
    // Faceted sphere — hexagon with facets
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // inner facets
    ctx.fillStyle = lightenColor(p.color, 20);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + Math.PI/6;
      const px = Math.cos(a) * r * 0.5;
      const py = Math.sin(a) * r * 0.5;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  } else if (p.shape === 'orb') {
    // Faceted orb — rounded with segments
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // facet lines
    ctx.strokeStyle = lightenColor(p.color, 25);
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.stroke();
    }
  }

  ctx.shadowBlur = 0;
  ctx.restore();

  // Eyes
  ctx.globalAlpha = p.stealthActive && p.abilityActive ? 0.3 : 1;
  drawEyes(p);

  // Shield effect
  if (p.shieldActive) {
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = 0.4 + Math.sin(frameCount * 0.15) * 0.2;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, r + 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // "IT" indicator
  if (p.isIt) {
    ctx.fillStyle = '#ff3366';
    ctx.font = 'bold 14px Space Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('IT!', x, y - r - 8);
  }

  ctx.globalAlpha = 1;
}

function drawEyes(p) {
  const x = p.x, y = p.y, r = p.radius;
  const eyeOffset = r * 0.3;
  const eyeSize = 3;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x - eyeOffset, y - 2, eyeSize, 0, Math.PI * 2);
  ctx.arc(x + eyeOffset, y - 2, eyeSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x - eyeOffset, y - 2, 1.5, 0, Math.PI * 2);
  ctx.arc(x + eyeOffset, y - 2, 1.5, 0, Math.PI * 2);
  ctx.fill();
}

function lightenColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = clamp((num >> 16) + percent, 0, 255);
  const g = clamp(((num >> 8) & 0xff) + percent, 0, 255);
  const b = clamp((num & 0xff) + percent, 0, 255);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

// ── Background ──
function drawBackground() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);

  // Geometric grid pattern
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  const gridSize = 40;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Subtle floating shapes
  for (let i = 0; i < 5; i++) {
    const t = frameCount * 0.003 + i * 1.2;
    const x = (Math.sin(t) * 0.5 + 0.5) * W;
    const y = (Math.cos(t * 0.7) * 0.5 + 0.5) * H;
    ctx.strokeStyle = 'rgba(168, 85, 247, 0.04)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 60 + Math.sin(t * 2) * 20, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ── Mini-games ──

// 1. SHARD RUSH
function initShardRush() {
  collectibles = [];
  for (let i = 0; i < 15; i++) {
    spawnShard();
  }
  roundDuration = 30;
}

function spawnShard() {
  collectibles.push({
    x: rand(40, W - 40),
    y: rand(40, H - 120),
    radius: 8,
    rotation: 0,
    type: 'shard',
    collected: false,
  });
}

function updateShardRush(dt) {
  for (const p of players) {
    updatePlayer(p, dt);
  }
  for (let i = collectibles.length - 1; i >= 0; i--) {
    const c = collectibles[i];
    c.rotation += 0.05;
    for (const p of players) {
      if (!p.alive) continue;
      if (dist(p, c) < p.radius + c.radius) {
        c.collected = true;
        p.roundScore++;
        spawnParticles(c.x, c.y, p.color, 12, 4);
        collectibles.splice(i, 1);
        // Respawn
        setTimeout(() => { if (gameState === 'playing') spawnShard(); }, 500);
        break;
      }
    }
  }
  // Keep at least 10 shards
  while (collectibles.length < 10) spawnShard();
}

function drawShardRush() {
  for (const c of collectibles) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation);
    ctx.shadowColor = COLORS.ami;
    ctx.shadowBlur = 8;
    ctx.fillStyle = COLORS.ami;
    ctx.beginPath();
    ctx.moveTo(0, -c.radius);
    ctx.lineTo(c.radius * 0.6, 0);
    ctx.lineTo(0, c.radius);
    ctx.lineTo(-c.radius * 0.6, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  for (const p of players) drawCrystal(p);
}

// 2. CRYSTAL TAG
function initCrystalTag() {
  taggerIndex = randInt(0, 3);
  for (let i = 0; i < players.length; i++) {
    players[i].isIt = (i === taggerIndex);
    players[i].roundScore = 0;
    players[i].tagCooldown = 0;
  }
  roundDuration = 20;
}

function updateCrystalTag(dt) {
  for (const p of players) {
    updatePlayer(p, dt);
  }
  const it = players[taggerIndex];
  if (!it.alive) return;

  for (const p of players) {
    if (p === it || !p.alive) continue;
    if (dist(it, p) < it.radius + p.radius && it.tagCooldown <= 0) {
      // Tag!
      if (p.shieldActive) {
        // Shielded — no tag
        spawnParticles(p.x, p.y, p.color, 10, 3);
      } else if (p.stealthActive && p.abilityActive) {
        // Stealth — can't be seen/tagged
      } else {
        // Tag happens
        p.isIt = true;
        it.isIt = false;
        it.tagCooldown = 1500;
        taggerIndex = p.index;
        p.roundScore += 2; // becoming it gives points (inverted)
        spawnParticles(p.x, p.y, '#ff3366', 20, 5);
        p.flashTimer = 600;
      }
    }
  }

  // Score: non-it players get points over time
  for (const p of players) {
    if (p.alive && !p.isIt) {
      p.roundScore += dt * 0.001;
    }
  }
}

function drawCrystalTag() {
  for (const p of players) drawCrystal(p);
}

// 3. CORRUPTION SURVIVAL
function initCorruptionSurvival() {
  corruptedCrystals = [];
  roundDuration = 45;
  for (const p of players) {
    p.roundScore = 0;
  }
  // Spawn initial corrupted
  for (let i = 0; i < 2; i++) spawnCorrupted();
}

function spawnCorrupted() {
  const side = randInt(0, 3);
  let x, y;
  if (side === 0) { x = rand(0, W); y = -20; }
  else if (side === 1) { x = W + 20; y = rand(0, H); }
  else if (side === 2) { x = rand(0, W); y = H + 20; }
  else { x = -20; y = rand(0, H); }
  corruptedCrystals.push({
    x, y,
    vx: 0, vy: 0,
    speed: rand(1.2, 2.2),
    radius: 14,
    rotation: 0,
    target: randInt(0, 3),
    spawnTimer: 0,
  });
}

function updateCorruptionSurvival(dt) {
  for (const p of players) {
    updatePlayer(p, dt);
    if (p.alive) p.roundScore += dt * 0.002; // survival points
  }

  // Update corrupted
  for (let i = corruptedCrystals.length - 1; i >= 0; i--) {
    const c = corruptedCrystals[i];
    // Find nearest alive player
    let nearest = null;
    let nearestDist = Infinity;
    for (const p of players) {
      if (!p.alive) continue;
      if (p.stealthActive && p.abilityActive) continue;
      const d = dist(c, p);
      if (d < nearestDist) { nearestDist = d; nearest = p; }
    }
    if (nearest) {
      const dx = nearest.x - c.x;
      const dy = nearest.y - c.y;
      const d = Math.hypot(dx, dy) || 1;
      c.vx = (dx / d) * c.speed;
      c.vy = (dy / d) * c.speed;
    }
    c.x += c.vx;
    c.y += c.vy;
    c.rotation += 0.04;

    // Check collision with players
    for (const p of players) {
      if (!p.alive) continue;
      if (dist(c, p) < c.radius + p.radius) {
        if (p.shieldActive) {
          // Destroy corrupted with shield
          spawnParticles(c.x, c.y, p.color, 15, 4);
          corruptedCrystals.splice(i, 1);
          break;
        } else {
          p.alive = false;
          spawnParticles(p.x, p.y, '#ff3366', 25, 6);
          p.flashTimer = 1000;
        }
      }
    }
  }

  // Spawn more over time
  if (frameCount % 180 === 0 && corruptedCrystals.length < 8) {
    spawnCorrupted();
  }
}

function drawCorruptionSurvival() {
  // Draw corrupted crystals
  for (const c of corruptedCrystals) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation);
    ctx.shadowColor = COLORS.corrupted;
    ctx.shadowBlur = 10;
    ctx.fillStyle = COLORS.corrupted;
    ctx.strokeStyle = '#ff6699';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const rr = i % 2 === 0 ? c.radius : c.radius * 0.5;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    // eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-4, -2, 2, 0, Math.PI * 2);
    ctx.arc(4, -2, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(-4, -2, 1, 0, Math.PI * 2);
    ctx.arc(4, -2, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (const p of players) {
    if (p.alive) drawCrystal(p);
  }
}

// ── Game Flow ──
function startNewGame() {
  players = [];
  for (let i = 0; i < 4; i++) {
    players.push(createPlayer(i));
  }
  roundNumber = 0;
  // Shuffle mini-games
  miniGames = ['shardRush', 'crystalTag', 'corruptionSurvival'];
  for (let i = miniGames.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [miniGames[i], miniGames[j]] = [miniGames[j], miniGames[i]];
  }
  startRound();
}

function startRound() {
  // Reset players
  for (const p of players) {
    const angles = [0, Math.PI/2, Math.PI, -Math.PI/2];
    p.x = W/2 + Math.cos(angles[p.index]) * 120;
    p.y = H/2 + Math.sin(angles[p.index]) * 120;
    p.vx = 0; p.vy = 0;
    p.roundScore = 0;
    p.alive = true;
    p.abilityActive = false;
    p.cooldownTimer = 0;
    p.abilityTimer = 0;
    p.shieldActive = false;
    p.stealthActive = false;
    p.dashTimer = 0;
    p.knowledgeTimer = 0;
    p.isIt = false;
    p.tagCooldown = 0;
    p.flashTimer = 0;
  }
  particles = [];
  collectibles = [];
  corruptedCrystals = [];

  currentMiniGame = miniGames[roundNumber % miniGames.length];
  if (currentMiniGame === 'shardRush') initShardRush();
  else if (currentMiniGame === 'crystalTag') initCrystalTag();
  else if (currentMiniGame === 'corruptionSurvival') initCorruptionSurvival();

  gameState = 'countdown';
  countdownTimer = 3000;
}

function endRound() {
  gameState = 'roundEnd';
  // Award scores
  if (currentMiniGame === 'shardRush') {
    for (const p of players) p.score += Math.floor(p.roundScore);
  } else if (currentMiniGame === 'crystalTag') {
    for (const p of players) p.score += Math.floor(p.roundScore);
  } else if (currentMiniGame === 'corruptionSurvival') {
    for (const p of players) p.score += Math.floor(p.roundScore);
  }
  roundNumber++;
  if (roundNumber >= maxRounds) {
    gameState = 'gameEnd';
  }
}

function getMiniGameName() {
  if (currentMiniGame === 'shardRush') return 'SHARD RUSH';
  if (currentMiniGame === 'crystalTag') return 'CRYSTAL TAG';
  if (currentMiniGame === 'corruptionSurvival') return 'CORRUPTION SURVIVAL';
  return '';
}

function getMiniGameDesc() {
  if (currentMiniGame === 'shardRush') return 'Collect the most knowledge shards!';
  if (currentMiniGame === 'crystalTag') return 'Don\'t get tagged!';
  if (currentMiniGame === 'corruptionSurvival') return 'Survive the corrupted crystals!';
  return '';
}

// ── Drawing Screens ──
function drawMenu() {
  drawBackground();

  // Title
  ctx.textAlign = 'center';
  ctx.shadowColor = COLORS.ami;
  ctx.shadowBlur = 20;
  ctx.fillStyle = COLORS.ami;
  ctx.font = 'bold 52px Space Mono, monospace';
  ctx.fillText('AGENT ARENA', W/2, 120);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#666';
  ctx.font = '14px Space Mono, monospace';
  ctx.fillText('4-PLAYER CRYSTAL COMBAT', W/2, 150);

  // Draw 4 characters
  const charY = 230;
  const spacing = 180;
  for (let i = 0; i < 4; i++) {
    const cfg = PLAYER_CONFIGS[i];
    const x = W/2 + (i - 1.5) * spacing;
    ctx.save();
    ctx.translate(x, charY);
    ctx.rotate(frameCount * 0.02 + i);
    ctx.shadowColor = cfg.color;
    ctx.shadowBlur = 15;
    ctx.fillStyle = cfg.color;
    ctx.strokeStyle = lightenColor(cfg.color, 30);
    ctx.lineWidth = 2;

    if (cfg.shape === 'cube') {
      ctx.beginPath();
      ctx.moveTo(0, -25); ctx.lineTo(20, 0); ctx.lineTo(0, 25); ctx.lineTo(-20, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (cfg.shape === 'icos') {
      ctx.beginPath();
      for (let j = 0; j < 6; j++) {
        const a = (j/6) * Math.PI * 2;
        const rr = j%2===0 ? 25 : 15;
        if (j===0) ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
        else ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (cfg.shape === 'sphere') {
      ctx.beginPath();
      for (let j = 0; j < 6; j++) {
        const a = (j/6) * Math.PI * 2;
        if (j===0) ctx.moveTo(Math.cos(a)*25, Math.sin(a)*25);
        else ctx.lineTo(Math.cos(a)*25, Math.sin(a)*25);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (cfg.shape === 'orb') {
      ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x - 7, charY - 3, 3, 0, Math.PI*2);
    ctx.arc(x + 7, charY - 3, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(x - 7, charY - 3, 1.5, 0, Math.PI*2);
    ctx.arc(x + 7, charY - 3, 1.5, 0, Math.PI*2);
    ctx.fill();

    // Name
    ctx.fillStyle = cfg.color;
    ctx.font = 'bold 16px Space Mono, monospace';
    ctx.fillText(cfg.name, x, charY + 50);
    ctx.fillStyle = '#555';
    ctx.font = '10px Space Mono, monospace';
    ctx.fillText(cfg.ctrlLabel, x, charY + 66);
    ctx.fillText(ABILITY_INFO[cfg.ability].name.toUpperCase(), x, charY + 80);
  }

  // Mini-game preview
  ctx.fillStyle = '#888';
  ctx.font = '12px Space Mono, monospace';
  ctx.fillText('GAMES: SHARD RUSH  •  CRYSTAL TAG  •  CORRUPTION SURVIVAL', W/2, 360);
  ctx.fillText('BEST OF 3 ROUNDS WINS', W/2, 380);

  // Start button
  const btnY = 450;
  const btnW = 260, btnH = 50;
  const btnX = W/2 - btnW/2;
  const hover = mouseInBox(btnX, btnY, btnW, btnH);
  ctx.fillStyle = hover ? COLORS.ami : '#1a1a2e';
  ctx.strokeStyle = COLORS.ami;
  ctx.lineWidth = 2;
  ctx.fillRect(btnX, btnY, btnW, btnH);
  ctx.strokeRect(btnX, btnY, btnW, btnH);
  ctx.fillStyle = hover ? '#fff' : COLORS.ami;
  ctx.font = 'bold 20px Space Mono, monospace';
  ctx.fillText('PRESS SPACE TO START', W/2, btnY + 32);

  // Controls hint
  ctx.fillStyle = '#444';
  ctx.font = '10px Space Mono, monospace';
  ctx.fillText('P1: WASD+Q   P2: Arrows+RShift   P3: IJKL+U   P4: TFGH+R', W/2, 540);
}

function mouseInBox(x, y, w, h) {
  return false; // simplified — keyboard only
}

function drawCountdown() {
  drawGameScene();
  ctx.fillStyle = 'rgba(10,10,18,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = COLORS.ami;
  ctx.font = 'bold 20px Space Mono, monospace';
  ctx.fillText(getMiniGameName(), W/2, H/2 - 40);
  ctx.fillStyle = '#aaa';
  ctx.font = '14px Space Mono, monospace';
  ctx.fillText(getMiniGameDesc(), W/2, H/2 - 15);
  const num = Math.ceil(countdownTimer / 1000);
  ctx.shadowColor = COLORS.ami;
  ctx.shadowBlur = 20;
  ctx.fillStyle = COLORS.ami;
  ctx.font = 'bold 72px Space Mono, monospace';
  ctx.fillText(num, W/2, H/2 + 50);
  ctx.shadowBlur = 0;
}

function drawGameScene() {
  drawBackground();
  if (currentMiniGame === 'shardRush') drawShardRush();
  else if (currentMiniGame === 'crystalTag') drawCrystalTag();
  else if (currentMiniGame === 'corruptionSurvival') drawCorruptionSurvival();
  drawParticles();

  // Timer
  ctx.fillStyle = '#aaa';
  ctx.font = 'bold 22px Space Mono, monospace';
  ctx.textAlign = 'center';
  const secs = Math.ceil(Math.max(0, roundTimer / 1000));
  ctx.fillText(secs + 's', W/2, 30);

  // Mini-game name
  ctx.fillStyle = COLORS.ami;
  ctx.font = '12px Space Mono, monospace';
  ctx.fillText(getMiniGameName(), W/2, 52);

  // Knowledge reveal effect
  for (const p of players) {
    if (p.knowledgeTimer > 0 && currentMiniGame === 'shardRush') {
      for (const c of collectibles) {
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 15, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
}

function drawRoundEnd() {
  drawGameScene();
  ctx.fillStyle = 'rgba(10,10,18,0.8)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = COLORS.ami;
  ctx.font = 'bold 28px Space Mono, monospace';
  ctx.fillText('ROUND ' + roundNumber + ' COMPLETE', W/2, H/2 - 60);

  ctx.fillStyle = '#aaa';
  ctx.font = '14px Space Mono, monospace';
  ctx.fillText(getMiniGameName(), W/2, H/2 - 30);

  // Scores
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    ctx.fillStyle = p.color;
    ctx.font = 'bold 16px Space Mono, monospace';
    ctx.fillText(p.name + ': ' + Math.floor(p.roundScore) + ' (Total: ' + p.score + ')', W/2, H/2 + i * 28);
  }

  ctx.fillStyle = '#666';
  ctx.font = '12px Space Mono, monospace';
  if (roundNumber < maxRounds) {
    ctx.fillText('Press SPACE for next round', W/2, H - 60);
  }
}

function drawGameEnd() {
  drawBackground();
  ctx.textAlign = 'center';

  // Find winner
  let winner = players[0];
  for (const p of players) {
    if (p.score > winner.score) winner = p;
  }

  ctx.shadowColor = winner.color;
  ctx.shadowBlur = 30;
  ctx.fillStyle = winner.color;
  ctx.font = 'bold 48px Space Mono, monospace';
  ctx.fillText(winner.name + ' WINS!', W/2, 180);
  ctx.shadowBlur = 0;

  // Draw winner crystal big
  ctx.save();
  ctx.translate(W/2, 300);
  ctx.rotate(frameCount * 0.03);
  ctx.shadowColor = winner.color;
  ctx.shadowBlur = 25;
  ctx.fillStyle = winner.color;
  ctx.strokeStyle = lightenColor(winner.color, 30);
  ctx.lineWidth = 3;
  if (winner.shape === 'cube') {
    ctx.beginPath();
    ctx.moveTo(0,-40); ctx.lineTo(32,0); ctx.lineTo(0,40); ctx.lineTo(-32,0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (winner.shape === 'icos') {
    ctx.beginPath();
    for (let j=0;j<6;j++){const a=(j/6)*Math.PI*2;const rr=j%2===0?40:24;if(j===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (winner.shape === 'sphere') {
    ctx.beginPath();
    for (let j=0;j<6;j++){const a=(j/6)*Math.PI*2;if(j===0)ctx.moveTo(Math.cos(a)*40,Math.sin(a)*40);else ctx.lineTo(Math.cos(a)*40,Math.sin(a)*40);}
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.restore();

  // Big eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(W/2-12, 295, 5, 0, Math.PI*2);
  ctx.arc(W/2+12, 295, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(W/2-12, 295, 2.5, 0, Math.PI*2);
  ctx.arc(W/2+12, 295, 2.5, 0, Math.PI*2);
  ctx.fill();

  // Final scores
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    ctx.fillStyle = p.color;
    ctx.font = 'bold 18px Space Mono, monospace';
    ctx.fillText(p.name + ': ' + p.score, W/2, 400 + i * 28);
  }

  ctx.fillStyle = COLORS.ami;
  ctx.font = 'bold 18px Space Mono, monospace';
  ctx.fillText('Press SPACE to play again', W/2, H - 80);
  ctx.fillStyle = '#555';
  ctx.font = '12px Space Mono, monospace';
  ctx.fillText('Press ESC for menu', W/2, H - 55);
}

// ── HUD ──
function buildHUD() {
  hudEl.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const cfg = PLAYER_CONFIGS[i];
    const div = document.createElement('div');
    div.className = 'hud-player';
    div.id = 'hud-' + i;
    div.innerHTML = `
      <div class="hud-name" style="color:${cfg.color}">${cfg.name}</div>
      <div class="hud-score" id="hud-score-${i}" style="color:${cfg.color}">0</div>
      <div class="hud-ability-label">${ABILITY_INFO[cfg.ability].name.toUpperCase()}</div>
      <div class="hud-cooldown-bar"><div class="hud-cooldown-fill" id="hud-cd-${i}" style="background:${cfg.color}"></div></div>
      <div class="hud-controls">${cfg.ctrlLabel}</div>
    `;
    hudEl.appendChild(div);
  }
}

function updateHUD() {
  for (let i = 0; i < 4; i++) {
    const p = players[i];
    if (!p) continue;
    const scoreEl = document.getElementById('hud-score-' + i);
    const cdEl = document.getElementById('hud-cd-' + i);
    if (scoreEl) scoreEl.textContent = p.score;
    if (cdEl) {
      const info = ABILITY_INFO[p.ability];
      const ratio = p.cooldownTimer > 0 ? (1 - p.cooldownTimer / info.cooldown) : 1;
      cdEl.style.width = (ratio * 100) + '%';
      if (p.abilityActive) {
        cdEl.style.opacity = '0.5';
        cdEl.style.background = '#fff';
      } else if (p.cooldownTimer <= 0) {
        cdEl.style.opacity = '1';
        cdEl.style.background = p.color;
      } else {
        cdEl.style.opacity = '0.6';
        cdEl.style.background = p.color;
      }
    }
  }
}

// ── Main Loop ──
function update(dt) {
  if (gameState === 'menu') {
    if (keys[' ']) {
      keys[' '] = false;
      startNewGame();
      buildHUD();
    }
  } else if (gameState === 'countdown') {
    countdownTimer -= dt;
    if (countdownTimer <= 0) {
      gameState = 'playing';
      roundTimer = roundDuration * 1000;
    }
  } else if (gameState === 'playing') {
    roundTimer -= dt;
    if (currentMiniGame === 'shardRush') updateShardRush(dt);
    else if (currentMiniGame === 'crystalTag') updateCrystalTag(dt);
    else if (currentMiniGame === 'corruptionSurvival') updateCorruptionSurvival(dt);

    updateParticles();

    // Check round end conditions
    if (roundTimer <= 0) {
      endRound();
    } else if (currentMiniGame === 'corruptionSurvival') {
      const alive = players.filter(p => p.alive).length;
      if (alive <= 1) endRound();
    }
  } else if (gameState === 'roundEnd') {
    updateParticles();
    if (keys[' '] && roundNumber < maxRounds) {
      keys[' '] = false;
      startRound();
    }
  } else if (gameState === 'gameEnd') {
    updateParticles();
    if (keys[' ']) {
      keys[' '] = false;
      startNewGame();
      buildHUD();
    }
    if (keys['escape']) {
      keys['escape'] = false;
      gameState = 'menu';
    }
  }
}

function render() {
  if (gameState === 'menu') drawMenu();
  else if (gameState === 'countdown') drawCountdown();
  else if (gameState === 'playing') drawGameScene();
  else if (gameState === 'roundEnd') drawRoundEnd();
  else if (gameState === 'gameEnd') drawGameEnd();
}

function loop(t) {
  const dt = Math.min(50, t - lastTime);
  lastTime = t;
  frameCount++;
  update(dt);
  render();
  updateHUD();
  requestAnimationFrame(loop);
}

// ── Resize ──
function resize() {
  const wrapper = document.getElementById('game-wrapper');
  const scale = Math.min(window.innerWidth / W, (window.innerHeight - 100) / H, 1);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);

// ── Init ──
buildHUD();
resize();
requestAnimationFrame(loop);

// Try to load crystal-eyes enhancements
if (typeof CrystalEyes !== 'undefined' && CrystalEyes.init) {
  CrystalEyes.init(canvas);
}
</script>
